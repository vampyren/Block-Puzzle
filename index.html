<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Puzzle Drag Preview</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    .wrap { position: relative; width: 420px; }
    canvas { display: block; background: #111827; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .hint { margin-top: 12px; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="420" height="520"></canvas>
    <div class="hint">Drag the blue piece. Green ghost = valid placement, red ghost = invalid.</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
